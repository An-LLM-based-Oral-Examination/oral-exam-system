# ==============================================================================
# Oral Exam System — Production Override cho VPS (https://oralexam.io.vn — 103.90.226.9)
# Cấu hình tối ưu tài nguyên cho VPS 6GB RAM + 4GB Swap (Phục vụ 120 SV đồng thời / 3 lớp)
# Cách chạy trên VPS (/opt/oralexam):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  postgres:
    command: >
      postgres
      -c max_connections=220
      -c shared_buffers=384MB
      -c effective_cache_size=1024MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c min_wal_size=256MB
      -c max_wal_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    mem_limit: 1536M
    mem_reservation: 512M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

  web-api:
    environment:
      DOTNET_gcServer: "1"
      DOTNET_GCHeapHardLimitPercent: "75"
      DOTNET_GCConserveMemory: "5"
      DOTNET_TieredPGO: "1"
      Gemini__Model: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      Gemini__FastModel: ${GEMINI_FAST_MODEL:-gemini-3.1-flash-lite}
    mem_limit: 2560M
    mem_reservation: 1024M
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2560M
        reservations:
          cpus: "1.0"
          memory: 1024M

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SIGNALR_HUB_URL: /hubs/practice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 256M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

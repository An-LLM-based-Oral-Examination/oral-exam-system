# Map Connection header cho SignalR WebSocket Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Redirect toàn bộ HTTP (80) sang HTTPS (443), ngoại trừ endpoint /healthz nội bộ container
server {
    listen 80;
    server_name oralexam.io.vn www.oralexam.io.vn localhost _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://oralexam.io.vn$request_uri;
    }
}

# 2. HTTPS (443) với chứng chỉ Let's Encrypt tại /etc/letsencrypt/live/oralexam.io.vn/
server {
    listen 443 ssl;
    http2 on;
    server_name oralexam.io.vn www.oralexam.io.vn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/oralexam.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralexam.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 15M;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # SPA React Fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache (1 năm, immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    }

    # Reverse Proxy REST API -> Backend .NET 8 (Port 5000)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse Proxy SignalR WebSocket Hubs (/hubs/practice, /hubs/in-class, /hubs/anti-cheat)
    location /hubs/ {
        proxy_pass http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse Proxy hình ảnh câu hỏi trong Backend wwwroot/uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }

    # Reverse Proxy Backend Health Check
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

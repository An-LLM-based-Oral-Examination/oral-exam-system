# Map Connection header cho SignalR WebSocket Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Phục vụ ACME challenge + /healthz trên HTTP (8080 -> host 80), sau đó chuyển hướng sang HTTPS (443)
server {
    listen 8080;
    server_name oralexam.io.vn www.oralexam.io.vn localhost _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://oralexam.io.vn$request_uri;
    }
}

# 2. HTTPS (8443 -> host 443) với chứng chỉ Let's Encrypt tại /etc/letsencrypt/live/oralexam.io.vn/
server {
    listen 8443 ssl;
    http2 on;
    server_name oralexam.io.vn www.oralexam.io.vn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/oralexam.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralexam.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 26M;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Always fetch the current SPA shell after a deployment. Hashed assets stay immutable below.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
    }

    # SPA React Fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache (1 năm, immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
    }

    # Reverse Proxy REST API -> Backend .NET 8 (Port 5000)
    location /api/ {
        client_max_body_size 26M;
        client_body_timeout 60s;
        error_page 408 = @api_timeout;
        error_page 413 = @api_too_large;
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_gateway_timeout;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    location @api_timeout {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
        return 408 '{"type":"about:blank","title":"Request Timeout","status":408,"detail":"Request body timeout.","errorCode":"REQUEST_TIMEOUT","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"Upload exceeds 26 MiB.","errorCode":"PAYLOAD_TOO_LARGE","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_bad_gateway {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
        return 502 '{"type":"about:blank","title":"Bad Gateway","status":502,"detail":"API is unavailable.","errorCode":"BAD_GATEWAY","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_gateway_timeout {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' blob: ws: wss: https://accounts.google.com https://oauth2.googleapis.com https://*.r2.cloudflarestorage.com https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" always;
        return 504 '{"type":"about:blank","title":"Gateway Timeout","status":504,"detail":"API response timeout.","errorCode":"REQUEST_TIMEOUT","traceId":"$request_id","instance":"/api/"}';
    }

    # Reverse Proxy SignalR WebSocket Hubs (/hubs/practice, /hubs/in-class, /hubs/anti-cheat)
    location /hubs/ {
        proxy_pass http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        access_log off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse Proxy hình ảnh câu hỏi trong Backend wwwroot/uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy Backend Health Check
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

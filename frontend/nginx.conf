# Map Connection header cho SignalR WebSocket Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost _;
    server_tokens off;

    client_max_body_size 15M;

    # 1. Bảo mật: Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # 2. Tối ưu Gzip Compression cho static text/css/js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # 3. Phục vụ SPA React: Fallback về index.html cho React Router
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 4. Cache cho static assets (1 năm, immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # 5. Reverse Proxy REST API về Backend .NET 8 (Port 5000)
    location /api/ {
        client_max_body_size 26M;
        client_body_timeout 15s;
        error_page 408 = @api_timeout;
        error_page 413 = @api_too_large;
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_gateway_timeout;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 100s;
    }

    # API-generated ProblemDetails pass through unchanged (proxy_intercept_errors stays off).
    location @api_timeout {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 408 '{"type":"about:blank","title":"Request Timeout","status":408,"detail":"Request body timeout.","errorCode":"REQUEST_TIMEOUT","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"Upload exceeds 26 MiB.","errorCode":"PAYLOAD_TOO_LARGE","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_bad_gateway {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 502 '{"type":"about:blank","title":"Bad Gateway","status":502,"detail":"API is unavailable.","errorCode":"BAD_GATEWAY","traceId":"$request_id","instance":"/api/"}';
    }
    location @api_gateway_timeout {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 504 '{"type":"about:blank","title":"Gateway Timeout","status":504,"detail":"API response timeout.","errorCode":"REQUEST_TIMEOUT","traceId":"$request_id","instance":"/api/"}';
    }

    # 6. Reverse Proxy SignalR WebSocket Hubs
    location /hubs/ {
        proxy_pass http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 7. Reverse Proxy hình ảnh câu hỏi được lưu trong Backend wwwroot/uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }

    # 8. Reverse Proxy Backend Health Check
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

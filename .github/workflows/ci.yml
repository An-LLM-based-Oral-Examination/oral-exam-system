name: Enterprise CI Quality Gate

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # =========================================================================
  # Job 0: Smart Path Filter (PR runs only affected lanes; develop/main runs full suite)
  # =========================================================================
  changes:
    name: Detect Affected Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      infra: ${{ steps.resolve.outputs.infra }}
      docker: ${{ steps.resolve.outputs.docker }}
    steps:
      - name: Checkout Code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Detect Changed Paths on Pull Request
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'scripts/lint_migrations_expand_contract.py'
              - 'scripts/verify_ci_yaml.py'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose*.yml'
              - '.env.example'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - 'scripts/**'
              - 'ops/**'
              - 'infra/**'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

      - name: Resolve Effective Gate Lanes
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "infra=${{ steps.filter.outputs.infra }}" >> "$GITHUB_OUTPUT"
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # Job 1: Backend Quality Gate (.NET 8 Clean Architecture)
  # =========================================================================
  backend-ci:
    name: Backend Quality Gate (.NET 8 Clean Architecture)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify CI Workflow YAML Syntax
        run: python3 scripts/verify_ci_yaml.py

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/OralExamination.sln

      - name: Build Backend Solution (Zero Warnings, Zero Errors)
        run: dotnet build backend/OralExamination.sln --configuration Release --no-restore -warnaserror -nowarn:NU1900

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Verify EF model matches migration snapshot
        timeout-minutes: 3
        run: >
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Infrastructure/Infrastructure.csproj
          --configuration Release
          --no-build

      - name: Run Expand-Contract Migration Linter
        run: python3 scripts/lint_migrations_expand_contract.py

      - name: Run Unit Tests with Coverage
        shell: pwsh
        run: |
          dotnet test backend/tests/OralExamination.UnitTests/OralExamination.UnitTests.csproj --configuration Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit.trx" --results-directory ./TestResults/unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml] $trx = Get-Content ./TestResults/unit/unit.trx -Raw
          $counts = $trx.SelectSingleNode('/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counts -or [int] $counts.total -le 0 -or [int] $counts.executed -ne [int] $counts.total -or [int] $counts.passed -ne [int] $counts.total -or [int] $counts.failed -ne 0 -or [int] $counts.notExecuted -ne 0) {
            throw 'Unit tests must execute at least one test and pass all tests without skips.'
          }

      - name: Upload Unit Test Results and Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-evidence
          path: TestResults/unit/
          retention-days: 14

      - name: Scan Vulnerable NuGet Packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list backend/OralExamination.sln package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          cat nuget-vulnerabilities.json
          jq -e '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length == 0' nuget-vulnerabilities.json

  # =========================================================================
  # Job 1b: Backend Integration Quality Gate (PostgreSQL 16 — Consolidated)
  # =========================================================================
  backend-integration:
    name: Backend Integration Quality Gate (PostgreSQL 16)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oralexam
          POSTGRES_PASSWORD: oralexam_password
          POSTGRES_DB: oralexam_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/OralExamination.sln

      - name: Build Backend Solution (Zero Warnings, Zero Errors)
        run: dotnet build backend/OralExamination.sln --configuration Release --no-restore -warnaserror -nowarn:NU1900

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF Migrations to Service PostgreSQL Database
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=oralexam_integration_test;Username=oralexam;Password=oralexam_password;Include Error Detail=true;
        run: >
          dotnet ef database update
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Infrastructure/Infrastructure.csproj
          --configuration Release
          --no-build

      - name: Run Service-Backed PostgreSQL Integration Tests (Category=Integration)
        shell: pwsh
        env:
          ORALEXAM_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=oralexam_integration_test;Username=oralexam;Password=oralexam_password;Include Error Detail=true;
        run: |
          dotnet test backend/tests/OralExamination.UnitTests/OralExamination.UnitTests.csproj --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=unit-integration.trx" --results-directory ./TestResults/unit-integration --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml] $trx = Get-Content ./TestResults/unit-integration/unit-integration.trx -Raw
          $counts = $trx.SelectSingleNode('/*[local-name()="TestRun"]/*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counts -or [int] $counts.total -le 0 -or [int] $counts.executed -ne [int] $counts.total -or [int] $counts.passed -ne [int] $counts.total -or [int] $counts.failed -ne 0 -or [int] $counts.notExecuted -ne 0) {
            throw 'Service-backed integration tests must execute at least one test and pass all tests without skips.'
          }

      - name: Run Isolated PostgreSQL Integration Tests Three Times (Category=PostgresIntegration)
        shell: pwsh
        run: ./backend/scripts/Test-PostgresIntegration.ps1 -Iterations 3 -Configuration Release -NoBuild -NoRestore

      - name: Upload Integration TRX, Coverage and Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-integration-evidence
          path: |
            TestResults/unit-integration/
            TestResults/integration/
          retention-days: 14

  # =========================================================================
  # Job 2: Frontend Quality Gate (React 19 & Vite)
  # =========================================================================
  frontend-ci:
    name: Frontend Quality Gate (React 19 & Vite)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Audit High-Severity npm Vulnerabilities
        run: npm run audit:ci

      - name: Lint Source Code (ESLint)
        run: npm run lint

      - name: Type Check (TypeScript strict composite)
        run: npx tsc -b

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Run Vitest and React Testing Library
        run: npm test -- --reporter=dot

      - name: Generate Vitest coverage report
        run: npm run test:coverage -- --reporter=dot

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright route and workflow tests
        run: npm run test:e2e

  # =========================================================================
  # Job 2b: Container & Compose Validation (Dockerfiles + Prod Override)
  # =========================================================================
  docker-validate:
    name: Container & Compose Validation (Dockerfiles + Prod)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify CI/CD Workflow YAML Syntax
        run: python3 scripts/verify_ci_yaml.py

      - name: Validate Docker Compose & Production Override Syntax
        env:
          POSTGRES_USER: oralexam
          POSTGRES_PASSWORD: ci_dummy_postgres_password_12345
          POSTGRES_DB: oralexam_db
          JWT_SIGNING_KEY: ci_dummy_jwt_signing_key_32_characters_minimum_length
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build Backend Production Image
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
        run: docker build -f backend/Dockerfile -t oralexam-backend:ci backend

      - name: Build Frontend Production Image
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL=/api/v1 --build-arg VITE_SIGNALR_HUB_URL=/hubs/practice -t oralexam-frontend:ci frontend

  # =========================================================================
  # Job 2c: Infra, Scripts & R2 Policy Validation
  # =========================================================================
  infra-lint:
    name: Infra, Scripts & Policy Lint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify CI/CD Workflow YAML Syntax
        run: python3 scripts/verify_ci_yaml.py

      - name: Validate Shell Scripts Syntax (bash -n)
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            bash -n "$f"
            count=$((count + 1))
          done < <(find scripts ops -type f -name '*.sh' -print0)
          test "$count" -gt 0

      - name: Run Expand-Contract Migration Linter Tests
        run: python3 scripts/test_lint_migrations_expand_contract.py

      - name: Validate R2 JSON Policies
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in infra/r2/*.json; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count + 1))
          done
          test "$count" -gt 0

  # =========================================================================
  # Job 3: Commit Message Linter (Conventional Commits v1.0.0)
  # =========================================================================
  commitlint:
    name: Commit Message Linter (Conventional Commits v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Enforce Conventional Commits on all feature/fix PRs, while skipping
    # historical re-linting on release PRs from develop into main.
    if: github.event_name == 'pull_request' && !(github.head_ref == 'develop' && github.base_ref == 'main')
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Commits with Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # =========================================================================
  # Job 4: Unified Required Gate for Branch Rulesets (works with path filters)
  # =========================================================================
  ci-gate:
    name: Enterprise CI Gate (Required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, backend-ci, backend-integration, frontend-ci, docker-validate, infra-lint, commitlint]
    steps:
      - name: Verify All Required Quality Gates
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "changes:${{ needs.changes.result }}"
            "backend-ci:${{ needs.backend-ci.result }}"
            "backend-integration:${{ needs.backend-integration.result }}"
            "frontend-ci:${{ needs.frontend-ci.result }}"
            "docker-validate:${{ needs.docker-validate.result }}"
            "infra-lint:${{ needs.infra-lint.result }}"
            "commitlint:${{ needs.commitlint.result }}"
          )
          failed=0
          for item in "${results[@]}"; do
            name="${item%%:*}"
            status="${item##*:}"
            echo "Gate ${name}: ${status}"
            if [[ "$status" != "success" && "$status" != "skipped" ]]; then
              failed=1
            fi
          done
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection job did not succeed." >&2
            exit 1
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more CI quality gates failed or were cancelled." >&2
            exit 1
          fi

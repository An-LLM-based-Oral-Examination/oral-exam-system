name: Enterprise CD Pipeline & Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # Job 1: Build & Push Container Images to GitHub Container Registry (GHCR)
  # =========================================================================
  build-and-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Đảm bảo đường dẫn build context tương thích dù chạy từ repository root hay submodule
      - name: Ensure Directory Structure Compatibility
        run: |
          if [ ! -d "./05_Source_Code" ]; then
            mkdir -p ./05_Source_Code
            ln -s ../backend ./05_Source_Code/backend
            ln -s ../frontend ./05_Source_Code/frontend
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./05_Source_Code/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./05_Source_Code/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # =========================================================================
  # Job 2: Remote Deployment via SSH to VPS
  # =========================================================================
  deploy:
    name: Remote Deployment to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "=== 1. Logging into GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== 2. Pulling Latest Production Images ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== 3. Starting Production Containers in Background ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 4. Pruning Dangling Docker Images ==="
            docker image prune -f

            echo "=== Deployment Completed Successfully ==="

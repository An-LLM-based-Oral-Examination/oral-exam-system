name: Enterprise CD Pipeline & Deployment

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # =========================================================================
  # Job 1: Build & Push Container Images to GitHub Container Registry (GHCR)
  # =========================================================================
  build-and-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const isReleaseRef =
              ['refs/heads/develop', 'refs/heads/main'].includes(context.ref) ||
              context.ref.startsWith('refs/tags/v');
            if (!isReleaseRef) {
              core.setFailed(`Production release requires develop, main, or v* tag, got ${context.ref}`);
              return;
            }
            if (context.eventName === 'workflow_dispatch') {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                status: 'success',
                per_page: 100
              });
              if (runs.length === 0) {
                core.setFailed(`No successful CI run for ${context.sha}`);
              }
            }

      - name: Checkout Code
        uses: actions/checkout@v4

      # Chuẩn hóa tên repository chữ thường cho GHCR và xác định đường dẫn context thật (không dùng symlink)
      - name: Resolve Lowercase Repository & Build Contexts
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ -d "./backend" ]; then
            echo "BACKEND_CONTEXT=./backend" >> "$GITHUB_ENV"
            echo "FRONTEND_CONTEXT=./frontend" >> "$GITHUB_ENV"
          else
            echo "BACKEND_CONTEXT=./05_Source_Code/backend" >> "$GITHUB_ENV"
            echo "FRONTEND_CONTEXT=./05_Source_Code/frontend" >> "$GITHUB_ENV"
          fi

      - name: Require Google OAuth client ID for frontend build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo 'VITE_GOOGLE_CLIENT_ID is required for production Google Login' >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_CONTEXT }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_CONTEXT }}
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

  # =========================================================================
  # Job 2: Remote Deployment via SSH to VPS
  # =========================================================================
  deploy:
    name: Remote Deployment to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH Deployment Credentials
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo 'SERVER_SSH_KEY is not configured; deployment stopped' >&2; exit 1; }

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '103.90.226.9' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -Eeuo pipefail
            cd /opt/oralexam
            env_bak="$HOME/.oralexam.env.bak.$$"
            if [ -f ".env" ]; then
              (umask 077 && cp .env "$env_bak")
            fi
            previous_sha=""
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "https://github.com/${{ github.repository }}.git" || git remote set-url origin "https://github.com/${{ github.repository }}.git"
            else
              test -z "$(git status --porcelain --untracked-files=no)" || {
                rm -f "$env_bak"
                echo "Tracked files on VPS are dirty; release stopped" >&2
                exit 1
              }
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
              previous_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            fi
            git fetch origin "${{ github.sha }}"
            previous_sha="${previous_sha:-${{ github.sha }}}"
            restore_checkout_on_error() {
              local status=$?
              trap - ERR
              git checkout --detach "$previous_sha" || true
              if [ -f "$env_bak" ]; then
                (umask 077 && cp "$env_bak" .env)
                chmod 600 .env
                rm -f "$env_bak"
              fi
              exit "$status"
            }
            trap restore_checkout_on_error ERR
            git checkout --detach "${{ github.sha }}"
            if [ -f "$env_bak" ]; then
              (umask 077 && cp "$env_bak" .env)
              chmod 600 .env
              rm -f "$env_bak"
            fi
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            repository_lower="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            bash scripts/deploy_cd_release.sh \
              '${{ github.sha }}' \
              "ghcr.io/${repository_lower}/backend:${{ github.sha }}" \
              "ghcr.io/${repository_lower}/frontend:${{ github.sha }}" \
              "$previous_sha"
            trap - ERR
